name: Test DEI bill sync

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dei-bill-sync.js'
      - 'workers/dei-bill-sync/**'
      - '.github/workflows/test-dei-bill-sync.yml'
  push:
    branches:
      - fix/dei-historical-bill-search
      - fix/dei-per-google-account
    paths:
      - 'dei-bill-sync.js'
      - 'workers/dei-bill-sync/**'
      - '.github/workflows/test-dei-bill-sync.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check workers/dei-bill-sync/src/index.mjs
          node --check workers/dei-bill-sync/test/worker.test.mjs
          node --check workers/dei-bill-sync/test/widget.test.mjs
          node --check dei-bill-sync.js

      - name: Run Worker integration tests
        run: node workers/dei-bill-sync/test/worker.test.mjs

      - name: Run T1 widget tests
        run: node workers/dei-bill-sync/test/widget.test.mjs
