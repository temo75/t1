name: DEI Worker tests

on:
  pull_request:
    paths:
      - "workers/dei-bill-sync/**"
      - ".github/workflows/dei-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "workers/dei-bill-sync/**"
      - ".github/workflows/dei-worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dei-bill-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker regression tests
        run: node test/worker.test.mjs
